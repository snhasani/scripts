[tools]
shfmt = "3.13.1"
shellcheck = "0.11.0"
lefthook = "2.1.10"
# Pinned (not left to apt) so the pty suite drives the SAME fzf/tmux in CI as
# on a dev machine. Ubuntu's apt fzf lags dev-machine Homebrew by ~30 minor
# releases and doesn't understand --footer/--footer-border at all — vise::tui
# depends on that flag, so "whatever apt has" was never a sound contract.
"aqua:junegunn/fzf" = "0.74.2"
"aqua:tmux/tmux-builds" = "3.7b"

# Shell scripts are found by shfmt itself (shebang + *.sh), never hand-listed, so
# a new tool needs no wiring here. bin/ holds only PATH symlinks to entrypoints —
# excluded so we format/lint each script once, at its real path, not through the link.
[tasks.fmt]
description = "Format shell scripts (shfmt -w). No args: whole repo. Args (paths): only those — used by the pre-commit hook to format staged files."
run = '''sh -c '
files=$(shfmt -f "${@:-.}" | grep -v "^\(\./\)\?bin/")
[ -n "$files" ] || { echo "no shell files"; exit 0; }
printf "%s\n" "$files" | {
	rc=0
	while IFS= read -r f; do shfmt -w "$f" || rc=1; done
	exit "$rc"
}
' fmt'''

[tasks.lint]
description = "Lint every shell script (shellcheck)"
run = '''
files=$(shfmt -f . | grep -v '^\(\./\)\?bin/')
[ -n "$files" ] || { echo "no shell files"; exit 0; }
printf '%s\n' "$files" | {
	rc=0
	while IFS= read -r f; do shellcheck "$f" || rc=1; done
	exit "$rc"
}
'''

[tasks.test]
description = "Run every *.smoke.sh with bash, plus vise doctor's offline catalog lint"
run = '''
find . -name '*.smoke.sh' -not -path './.git/*' -not -path './bin/*' -print | sort | {
	rc=0
	found=0
	while IFS= read -r t; do
		found=1
		echo "== $t =="
		bash "$t" || rc=1
	done
	[ "$found" -eq 1 ] || echo "no smoke tests found"
	exit "$rc"
}
smoke_rc=$?

echo "== vise doctor =="
bash vise/vise doctor
doctor_rc=$?

[ "$smoke_rc" -eq 0 ] && [ "$doctor_rc" -eq 0 ]
'''

# Not part of [tasks.test]: starts a real fzf inside a real tmux pty per case,
# an order of magnitude slower than the hermetic suite above and dependent on
# tmux/fzf being installed. Opt in explicitly with `mise run test-pty`.
[tasks.test-pty]
description = "Drive vise's fzf key bindings through a real pty (tmux). Slower, needs tmux+fzf; not run by `mise run test`."
run = "bash vise/vise.pty.sh"
